apiVersion: apps/v1
kind: Deployment
metadata:
  name: cv-site
  namespace: cv-site
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: cv-site
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi