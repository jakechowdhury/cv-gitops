# NodePort mode — no cloud load balancer provisioned.
# In production: set service.type: LoadBalancer and the cloud provider provisions an LB automatically.
# NodePort is a deliberate free-tier tradeoff, not a gap in understanding.
service:
  type: NodePort

ports:
  web:
    nodePort: 30080
  websecure:
    nodePort: 30443

# Dashboard accessible via port-forward only — not exposed externally
# kubectl port-forward svc/traefik -n traefik 9000:9000
dashboard:
  enabled: true

additionalArguments:
  # Allows Traefik to route to ArgoCD's self-signed cert without verification errors
  - "--serversTransport.insecureSkipVerify=true"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi