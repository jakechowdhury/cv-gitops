name: Verify image signature

on:
  pull_request:
    types: [opened, labeled, synchronize, reopened]
    paths:
      - apps/cv-site/kustomization.yaml

jobs:
  cosign-verify:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'cv-release')
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image reference
        id: image
        run: |
          NAME=$(yq '.images[0].name' apps/cv-site/kustomization.yaml)
          TAG=$(yq '.images[0].newTag' apps/cv-site/kustomization.yaml)
          echo "ref=${NAME}:${TAG}" >> $GITHUB_OUTPUT

      - name: Verify image signature
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/jakechowdhury/cv-site/.github/workflows/release.yml@refs/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ${{ steps.image.outputs.ref }}
