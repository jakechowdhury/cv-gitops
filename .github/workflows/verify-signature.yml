name: Verify image signature

on:
  pull_request:
    types: [opened, labeled, synchronize, reopened]
    paths:
      - apps/cv-site/kustomization.yaml

jobs:
  cosign-verify:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'cv-release')
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image reference
        id: image
        run: |
          IMAGE=$(grep 'name:' apps/cv-site/kustomization.yaml | awk '{print $2}')
          DIGEST=$(grep 'digest:' apps/cv-site/kustomization.yaml | awk '{print $2}')
          echo "ref=${IMAGE}@${DIGEST}" >> $GITHUB_OUTPUT

      - name: Verify cosign signature
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/jakechowdhury/cv-site/.github/workflows/release.yml@refs/tags/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ${{ steps.image.outputs.ref }}
